[package]
name = "econ"
version = "0.1.0"
edition = "2021"
description = "Soko Kuu economy rules: pricing, events, chama, credit, stability sim. No NEAR deps."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.borsh]
version = "1"
optional = true
features = ["derive"]

[features]
default = []
borsh = ["dep:borsh"]

[lib]
path = "src/lib.rs"
