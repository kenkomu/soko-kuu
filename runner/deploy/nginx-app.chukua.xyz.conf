# /etc/nginx/sites-available/app.chukua.xyz   (symlink it into sites-enabled; see CHECKLIST.md)
#
# A SEPARATE server block only for app.chukua.xyz. It does not touch, include or replace any other site on this nginx.
# Do not edit any other file under /etc/nginx. Do not add default_server to the listen lines.
#
# Step 1: install this file as is (HTTP only). `sudo nginx -t && sudo systemctl reload nginx`.
# Step 2: `sudo certbot --nginx -d app.chukua.xyz`. Certbot edits ONLY this file: it adds a second `listen 443 ssl;`
#         (and the `ssl_certificate`, `ssl_certificate_key`, `include .../options-ssl-nginx.conf` and `ssl_dhparam` lines)
#         to this block and a port-80 server block that redirects to https. It uses the acme-challenge on port 80 of this
#         server_name, so the Namecheap A record must already point at this VPS.
#
# If the runner uses another port than 8787 (env PORT in /etc/sokokuu/runner.env), change BOTH proxy_pass lines below.
# CORS headers are set by the runner (CORS_ORIGINS): do NOT add any add_header Access-Control-* here.

server {
    listen 80;
    listen [::]:80;
    server_name app.chukua.xyz;

    client_max_body_size 64k;

    # Long-poll (25 s): send bytes the moment they exist, never buffer, never compress.
    location = /v1/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The runner (TRUST_PROXY=1) rate-limits on the LAST address in X-Forwarded-For, which nginx appends itself
        # ($proxy_add_x_forwarded_for), so a client cannot fake it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
