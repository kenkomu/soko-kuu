[package]
name = "sokokuu-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.18", default-features = false, features = ["legacy"] }
near-sdk-contract-tools = "4.0.0"
serde_json = "1"
econ = { path = "../econ", features = ["borsh"] }

[dev-dependencies]
near-sdk = { version = "5.18", default-features = false, features = ["legacy", "unit-testing", "non-contract-usage"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
